<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="fre-title">
  <title id="fre-title">점 기반 강체 정합에서 FRE와 TRE의 차이</title>
  <rect x="8" y="8" width="704" height="244" rx="8" fill="#f6f7f8" stroke="#c9cdd3"/>
  <defs>
    <style>
      .label { font-family: system-ui, "Noto Sans KR", sans-serif; font-size: 14px; fill: #1a1d21; }
      .sub { font-size: 12px; fill: #4a5560; }
      .cap { font-size: 13px; fill: #2b3a4a; }
      .fid { fill: #2563eb; stroke: #1e40af; stroke-width: 1.5; }
      .tgt { fill: #c2410c; stroke: #9a3412; stroke-width: 1.5; }
      .res { stroke: #dc2626; stroke-width: 1.5; fill: none; marker-end: url(#err); }
      .tre-zone { fill: none; stroke: #dc2626; stroke-width:1.5; stroke-dasharray: 4 3; opacity: 0.85; }
    </style>
    <marker id="err" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text class="label" x="32" y="40">표지점(Fiducial)과 잔차 — FRE</text>
  <text class="sub" x="32" y="58">Fiducial Registration Error (FRE)</text>

  <!-- fiducials cluster -->
  <circle class="fid" cx="88" cy="130" r="7"/>
  <circle class="fid" cx="118" cy="108" r="7"/>
  <circle class="fid" cx="148" cy="125" r="7"/>
  <circle class="fid" cx="128" cy="152" r="7"/>

  <!-- matched positions (hollow) and residual arrows -->
  <circle cx="95" cy="123" r="5" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line class="res" x1="88" y1="130" x2="95" y2="123"/>

  <circle cx="112" cy="115" r="5" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line class="res" x1="118" y1="108" x2="112" y2="115"/>

  <circle cx="141" cy="131" r="5" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line class="res" x1="148" y1="125" x2="141" y2="131"/>

  <circle cx="122" cy="145" r="5" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line class="res" x1="128" y1="152" x2="122" y2="145"/>

  <text class="cap" x="88" y="178">표지점 근처의 작은 잔차</text>

  <!-- divider -->
  <line x1="360" y1="32" x2="360" y2="210" stroke="#d1d5db" stroke-width="1"/>

  <text class="label" x="392" y="40">관심 위치 — TRE</text>
  <text class="sub" x="392" y="58">Target Registration Error (TRE)</text>

  <!-- distant fiducials (faint) -->
  <circle class="fid" cx="420" cy="160" r="5" opacity="0.45"/>
  <circle class="fid" cx="448" cy="138" r="5" opacity="0.45"/>
  <circle class="fid" cx="468" cy="168" r="5" opacity="0.45"/>

  <!-- target point -->
  <polygon class="tgt" points="580,118 592,142 568,142"/>
  <circle class="tre-zone" cx="580" cy="132" r="28"/>
  <line class="res" x1="580" y1="118" x2="580" y2="104"/>
  <circle cx="580" cy="100" r="4" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <text class="cap" x="520" y="178">표지점에서 떨어진 목표점의 오차</text>
  <text class="sub" x="392" y="200">FRE가 작아도 TRE는 다르게 나타날 수 있다.</text>
</svg>